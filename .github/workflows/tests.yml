name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, pdo_mysql, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build

      - name: Run CI checks
        run: composer ci:check

  playwright:
    name: playwright e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, pdo_sqlite, sqlite3, gd
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup application
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Run Playwright journeys
        run: npm run test:e2e
        env:
          E2E_PHP: php

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  mysql:
    name: mysql verification
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: hrms_lite_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php -r '
            $path = ".env";
            $env = file_get_contents($path);
            $replacements = [
              "DB_CONNECTION" => "mysql",
              "DB_HOST" => "127.0.0.1",
              "DB_PORT" => "3306",
              "DB_DATABASE" => "hrms_lite_test",
              "DB_USERNAME" => "root",
              "DB_PASSWORD" => "password",
            ];
            foreach ($replacements as $key => $value) {
              if (preg_match("/^#?\s*{$key}=.*/m", $env)) {
                $env = preg_replace("/^#?\s*{$key}=.*/m", "{$key}={$value}", $env, 1);
              } else {
                $env .= PHP_EOL."{$key}={$value}";
              }
            }
            file_put_contents($path, $env);
          '

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if php -r 'try { new PDO("mysql:host=127.0.0.1;port=3306;dbname=hrms_lite_test", "root", "password"); echo "ok"; exit(0);} catch (Throwable $e) { fwrite(STDERR, $e->getMessage().PHP_EOL); exit(1);}'; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready" >&2
          exit 1

      - name: Run attendance and salary tests on MySQL 8
        # Use phpunit directly: `artisan test` already injects --configuration and rejects a second one.
        run: ./vendor/bin/phpunit --configuration=phpunit.mysql.xml
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_DATABASE: hrms_lite_test
          DB_USERNAME: root
          DB_PASSWORD: password
          DB_URL: ""
